# Re-compose the newsletter with the admin's notes and update the Brevo draft
# (a new test email arrives) with scripts/correct.py. Launched by hand: Actions → «Corregir boletín»
# → Run workflow. Same conditions as diario.yml.
name: Corregir boletín

on:
  workflow_dispatch:
    inputs:
      notas:
        description: "Qué cambiar, por ejemplo: «Quita la fecha del retiro, aún no está confirmada». Vacío: redactar de nuevo sin indicaciones."
        required: false
        type: string
      mes:
        description: "Mes, AAAA-MM. Vacío: el mes actual."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: boletin-estado
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  corregir:
    if: vars.BOLETIN_PRODUCCION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar que el repositorio es privado
        id: privado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::El repositorio es público: no se ejecuta. Ver README, «Puesta en producción»."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Redactar de nuevo y actualizar Brevo
        env:
          NOTAS: ${{ inputs.notas }}
          MES: ${{ inputs.mes }}
        run: |
          args=(--notes "$NOTAS")
          if [ -n "$MES" ]; then args+=(--month "$MES"); fi
          python scripts/correct.py "${args[@]}"

      - name: Guardar el estado
        if: always() && steps.privado.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p data logs
          git add -f data logs
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -q -m "Estado: $(date '+%Y-%m-%d %H:%M') ($GITHUB_WORKFLOW)"
          for _ in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
