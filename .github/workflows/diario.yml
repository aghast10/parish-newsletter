# Daily run of scripts/run_daily.py: collects emails, sends the reminder and,
# from publish_day on, prepares the month's Brevo draft. Then commits data/
# and logs/ (the state) to the repository.
#
# Only for the private production copy (README, «Puesta en producción»): it
# runs when the repository variable BOLETIN_PRODUCCION is "true", and refuses
# to run in a public repository, which would publish the secretaries' emails.
name: Diario

on:
  schedule:
    # UTC. Two runs a day in case one is delayed or skipped; run_daily.py
    # only does what is still pending. 06:17/14:17 UTC = 08:17/16:17 in Madrid
    # in summer, 07:17/15:17 in winter.
    - cron: "17 6 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, shared with corregir.yml: both change data/.
concurrency:
  group: boletin-estado
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  diario:
    if: vars.BOLETIN_PRODUCCION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar que el repositorio es privado
        id: privado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::El repositorio es público: no se ejecuta, para no publicar los correos de los secretarios. Ver README, «Puesta en producción»."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tareas del día
        run: python scripts/run_daily.py

      # Also after a failure: what was collected must not be collected again.
      - name: Guardar el estado
        if: always() && steps.privado.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p data logs
          git add -f data logs
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -q -m "Estado: $(date '+%Y-%m-%d %H:%M') ($GITHUB_WORKFLOW)"
          for _ in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
