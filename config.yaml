llm:
  # Keys in .env: ANTHROPIC_API_KEY or OPENAI_API_KEY.
  provider: anthropic         # anthropic | openai
  model: claude-opus-5-5      # e.g. claude-sonnet-5-5 (cheaper), or an OpenAI model id
  effort: medium              # anthropic only: low | medium | high | xhigh | max
  # base_url: https://...     # openai only: any OpenAI-compatible API (Mistral, Ollama...)

brevo:
  # API key in .env (BREVO_API_KEY). The sender must be verified in Brevo.
  list_id: 1                  # Brevo contact list with the newsletter recipients
  sender_name: "Parroquia Perpetuo Socorro"
  sender_email: "boletin@example.com"
