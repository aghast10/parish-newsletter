# Parish Newsletter Configuration
# --------------------------------

parish:
  name: "Parroquia Nuestra Señora del Perpetuo Socorro"
  address: "Av. Fco. de Goya, 7 — Zaragoza"
  phone: "+34 976 27 47 81"
  email: "zaragozaperpetuosocorro@gmail.com"
  website: "https://perpetuosocorro.com"
  logo_url: "https://perpetuosocorro.com/wp-content/uploads/go-x/u/b32e3365-10bb-4a7f-aaed-bcdfaf04da21/image.png"

schedule:
  collection_start_day: 10   # Accept emails from this day of month
  reminder_day: 20           # Remind missing groups
  publish_day: 25            # Compose + send draft for review

