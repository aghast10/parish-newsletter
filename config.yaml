  - id: confirmacion
    name: "Confirmación"
    emoji: "🔥"
    secretary_email: "confirmacion@example.com"
    description: "Preparación al sacramento de la Confirmación"
  - id: jovenes-universitarios
    name: "Jóvenes y Universitarios"
    emoji: "🎓"
    secretary_email: "jovenes@example.com"
    description: "Grupo juvenil y universitario"
  - id: grupos-vita
    name: "Adultos: Grupos VITA"
    emoji: "🌿"
    secretary_email: "vita@example.com"
    description: "Comunidades de vida adulta VITA"
  - id: novios
    name: "Novios: A Fuego Lento"
    emoji: "💍"
